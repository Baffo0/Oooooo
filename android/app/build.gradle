plugins {
    id 'com.android.application'
}

// Su GitHub Actions ogni build ha un numero progressivo: lo usiamo come versionCode
// così ogni APK nuovo si installa come aggiornamento di quello precedente.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// La web app (../public) e la pagina di scelta modalità (src/main/web) vengono copiate qui
// a ogni build e finiscono negli asset dell'APK sotto www/.
def webAssetsRoot = layout.buildDirectory.dir('generated/webassets').get().asFile
def webAssetsWww = new File(webAssetsRoot, 'www')
def localConfig = 'window.CABINE_CONFIG = { local: true };\n'

android {
    namespace 'it.cabinefibra.mappa'
    compileSdk 35

    defaultConfig {
        applicationId 'it.cabinefibra.mappa'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    signingConfigs {
        // Chiave di PROVA salvata nel repository: serve solo perché ogni build della CI
        // abbia la stessa firma e si installi sopra la precedente senza disinstallare.
        // ATTENZIONE: la chiave è pubblica, quindi chiunque può firmare un APK che Android
        // installa come aggiornamento di questa app (ereditandone dati e permessi). Installare
        // e aggiornare solo dal link ufficiale della release apk-test.
        // Prima dell'uso reale serve una chiave privata tenuta fuori dal repository (ad esempio
        // nei secret di GitHub, decodificata in CI) e una build non di debug.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(webAssetsRoot)
        }
    }

    lint {
        // Le build di prova non devono fallire per avvisi di lint.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    group = 'build'
    description = 'Copia la web app e la pagina di configurazione negli asset dell\'APK.'

    // Prima la web app, poi la pagina di configurazione (che vince in caso di nomi uguali).
    from(rootProject.file('../public')) {
        exclude '**/.DS_Store'
    }
    from('src/main/web')
    into(webAssetsWww)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // config.js dice alla web app che gira dentro l'APK senza server (dati su IndexedDB).
    // Viene scritto dopo la copia così sostituisce un eventuale config.js di ../public.
    inputs.property('localConfig', localConfig)
    doLast {
        new File(webAssetsWww, 'config.js').setText(localConfig, 'UTF-8')
    }
}

// Gli asset devono essere sempre aggiornati prima che AGP li unisca nell'APK: preBuild
// li prepara all'inizio di ogni build e la dipendenza diretta dei task che leggono la
// cartella generata (merge*Assets, lint) soddisfa i controlli di Gradle sulle dipendenze.
tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name ==~ /merge\w*Assets/ || task.name.toLowerCase().contains('lint')) {
        task.dependsOn syncWebAssets
    }
}
